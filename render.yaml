# Render Blueprint: deploys the FastAPI backend from ./backend.
# In the Render dashboard: New -> Blueprint -> select this repo.
# After the Vercel frontend is live, set ALLOWED_ORIGINS below (or in the
# dashboard) to the Vercel URL, e.g. "https://my-app.vercel.app".
services:
  - type: web
    name: attendance-tracker-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173
